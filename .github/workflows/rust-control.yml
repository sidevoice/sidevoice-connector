name: Native control migration

# Isolated migration branch only; does not dispatch or alter the beta producer.
on:
  push:
    branches: [feat/rust-control-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control:
    name: Native control tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/connector-rust
      - name: Check formatting
        run: cargo fmt --manifest-path packages/connector-rust/Cargo.toml --all --check
      - name: Compile and test the native control paths
        run: cargo test --locked --manifest-path packages/connector-rust/Cargo.toml
      - name: Check native control warnings
        run: cargo clippy --locked --manifest-path packages/connector-rust/Cargo.toml --all-targets -- -D warnings
