name: Rust Core source dependency

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/connector/**'
      - 'packages/connector-rust/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rust-core-consumer.yml'

permissions:
  contents: read

concurrency:
  group: rust-core-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CORE_SOURCE_SHA: b41840e41e3eb81905d285514c7deb35bd8efe57
  CORE_LOCK_SHA256: b0e068cf34f5c1549c00add4c2d94e06af3758bb1586c2e58f192220a22b53e9

jobs:
  core-native:
    name: Build pinned Core (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: macos-aarch64
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sidevoice/sidevoice-core
          ref: ${{ env.CORE_SOURCE_SHA }}
          path: core-src
          persist-credentials: false
      - name: Verify pinned public Core source and lockfile
        run: |
          set -euo pipefail
          test "$(git -C core-src rev-parse HEAD)" = "$CORE_SOURCE_SHA"
          test "$(shasum -a 256 core-src/Cargo.lock | cut -d ' ' -f 1)" = "$CORE_LOCK_SHA256"
      - name: Install the Core producer's native build dependencies
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          if [[ "$TARGET" == macos-* ]]; then
            brew install opus zstd
          else
            sudo apt-get update
            sudo apt-get install -y libopus-dev patchelf zstd pkg-config
          fi
      - name: Build and verify the existing Core native bundle
        working-directory: core-src
        env:
          TARGET: ${{ matrix.target }}
          RUSTVANI_CACHE_DIR: ${{ runner.temp }}/sidevoice-models
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo tree --locked >/dev/null
          python3 scripts/stage_rust_models.py "$RUSTVANI_CACHE_DIR"
          cargo build --locked --release --bin sidevoice-core-rust
          mkdir -p assets/native
          ARCHIVE="assets/native/sidevoice-core-rust-${CORE_SOURCE_SHA}-${TARGET}.tar.zst"
          python3 tools/rust_native_bundle.py build --target "$TARGET" \
            --binary target/release/sidevoice-core-rust --models "$RUSTVANI_CACHE_DIR" \
            --output "$ARCHIVE" --source-sha "$CORE_SOURCE_SHA" \
            --epoch "$(git show -s --format=%ct HEAD)"
          python3 tools/rust_native_bundle.py verify --archive "$ARCHIVE"
      - uses: actions/upload-artifact@v4
        with:
          name: core-native-${{ matrix.target }}
          path: core-src/assets/native/*.tar.zst
          if-no-files-found: error
          retention-days: 1

  core-manifest:
    name: Assemble Core's closed native manifest
    needs: core-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sidevoice/sidevoice-core
          ref: ${{ env.CORE_SOURCE_SHA }}
          path: core-src
          persist-credentials: false
      - name: Verify pinned source and lockfile
        run: |
          set -euo pipefail
          test "$(git -C core-src rev-parse HEAD)" = "$CORE_SOURCE_SHA"
          test "$(sha256sum core-src/Cargo.lock | cut -d ' ' -f 1)" = "$CORE_LOCK_SHA256"
      - name: Install the Core archive verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - uses: actions/download-artifact@v4
        with:
          pattern: core-native-*
          path: core-src/assets/native
          merge-multiple: true
      - name: Validate all target archives and write Core's manifest
        working-directory: core-src
        run: python3 tools/rust_native_bundle.py manifest --assets assets/native --source-sha "$CORE_SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: core-source-inputs
          path: core-src/assets/native/
          if-no-files-found: error
          retention-days: 1

  consumer:
    name: ${{ matrix.target }} native pair and tests
    needs: core-manifest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-aarch64
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify exact Connector source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: core-source-inputs
          path: ${{ runner.temp }}/core-inputs
      - uses: actions/setup-node@v4
        with:
          node-version: v22.23.3
      - run: test "$(node --version)" = v22.23.3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: npm ci
      - name: Build the exact target Rust Connector executable
        env:
          SIDEVOICE_CONNECTOR_BUILD_SHA: ${{ env.CANDIDATE_SHA }}
          SIDEVOICE_CONNECTOR_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          SIDEVOICE_CONNECTOR_VERSION="$(node -p "require('./packages/connector/package.json').version")"
          export SIDEVOICE_CONNECTOR_VERSION
          cargo build --locked --release --manifest-path packages/connector-rust/Cargo.toml
      - name: Build this target SEA with its source-built Core
        env:
          SIDEVOICE_BUILD_SEA: '1'
          SIDEVOICE_REQUIRE_RUST_CORE: '1'
          SIDEVOICE_RUST_CORE_SOURCE_BUILD: '1'
          SIDEVOICE_REQUIRE_RUST_CONNECTOR: '1'
          SIDEVOICE_CONNECTOR_SHA: ${{ env.CANDIDATE_SHA }}
          SIDEVOICE_RUST_CONNECTOR_SOURCE_SHA: ${{ env.CANDIDATE_SHA }}
          SIDEVOICE_RUST_CONNECTOR_TARGET: ${{ matrix.target }}
          SIDEVOICE_RUST_CONNECTOR_BINARY: ${{ github.workspace }}/packages/connector-rust/target/release/sidevoice-rust-proof
          SIDEVOICE_RUST_CORE_SOURCE_SHA: ${{ env.CORE_SOURCE_SHA }}
          SIDEVOICE_RUST_CORE_TARGET: ${{ matrix.target }}
          SIDEVOICE_RUST_CORE_MANIFEST: ${{ runner.temp }}/core-inputs/native-core-manifest.json
        run: npm run build:sea -w @sidevoice/uplink
      - name: Test the source-built Core and installed pair
        env:
          SIDEVOICE_RUST_CORE_SOURCE_BUILD: '1'
          SIDEVOICE_RUST_CORE_SOURCE_SHA: ${{ env.CORE_SOURCE_SHA }}
          SIDEVOICE_RUST_CORE_TARGET: ${{ matrix.target }}
          SIDEVOICE_RUST_CORE_MANIFEST: ${{ runner.temp }}/core-inputs/native-core-manifest.json
        run: npm test -w @sidevoice/uplink
      - uses: astral-sh/setup-uv@v6
        if: matrix.target == 'macos-aarch64'
      - name: Prove disposable pairing and native launchd pair
        if: matrix.target == 'macos-aarch64'
        env:
          SIDEVOICE_TEST_SEA: ${{ github.workspace }}/packages/connector/dist-sea/macos-aarch64/sidevoice
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/pairing-test"
          uv pip install --python "$RUNNER_TEMP/pairing-test/bin/python" python-socketio uvicorn
          "$RUNNER_TEMP/pairing-test/bin/python" packages/connector-rust/test/installed_pairing.py
      - name: Upload the exact tested Mac pair executable
        if: matrix.target == 'macos-aarch64' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sidevoice-rust-pair-macos-aarch64
          path: packages/connector/dist-sea/macos-aarch64/sidevoice
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  attest-mac-pair:
    name: Attest tested Mac Rust pair
    needs: consumer
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sidevoice-rust-pair-macos-aarch64
          path: ${{ runner.temp }}/rust-pair
      - name: Verify the downloaded subject layout and identity
        run: |
          set -euo pipefail
          test "$(find "$RUNNER_TEMP/rust-pair" -mindepth 1 -maxdepth 1 -type f -printf '%f\n')" = sidevoice
          test ! -L "$RUNNER_TEMP/rust-pair/sidevoice"
          chmod 755 "$RUNNER_TEMP/rust-pair/sidevoice"
          "$RUNNER_TEMP/rust-pair/sidevoice" --version --json > "$RUNNER_TEMP/rust-pair-version.json"
          python3 - "$RUNNER_TEMP/rust-pair-version.json" "$GITHUB_SHA" <<'PY'
          import json, sys
          version = json.load(open(sys.argv[1], encoding='utf-8'))
          assert version['ok'] is True and version['sea'] is True
          assert version['target'] == 'macos-aarch64' and version['connector_sha'] == sys.argv[2]
          PY
      - name: Generate GitHub Sigstore provenance for the tested executable
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/rust-pair/sidevoice
      - name: Verify exact protected-main provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: >-
          gh attestation verify "$RUNNER_TEMP/rust-pair/sidevoice"
          --repo sidevoice/sidevoice-connector
          --bundle "$BUNDLE"
          --signer-workflow github.com/sidevoice/sidevoice-connector/.github/workflows/rust-core-consumer.yml
          --source-ref refs/heads/main
          --source-digest "$GITHUB_SHA"
          --deny-self-hosted-runners
      - name: Upload provenance beside the tested executable
        run: |
          mkdir -p "$RUNNER_TEMP/rust-pair-provenance"
          cp "${{ steps.attest.outputs.bundle-path }}" "$RUNNER_TEMP/rust-pair-provenance/sidevoice.sigstore.json"
          test -s "$RUNNER_TEMP/rust-pair-provenance/sidevoice.sigstore.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sidevoice-rust-pair-macos-aarch64-provenance
          path: ${{ runner.temp }}/rust-pair-provenance/sidevoice.sigstore.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
