name: Rust Core consumer

on:
  pull_request_target:
    branches: [main]
    paths:
      - 'packages/connector/**'
      - '.github/workflows/rust-core-consumer.yml'
  push:
    branches: [main]
    paths:
      - 'packages/connector/**'
      - '.github/workflows/rust-core-consumer.yml'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full Connector commit SHA to test from the trusted main workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rust-core-consumer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CORE_RUN_ID: '37165556340'
  CORE_SOURCE_SHA: b41840e41e3eb81905d285514c7deb35bd8efe57
  CORE_REPOSITORY: sidevoice/sidevoice-core
  CORE_WORKFLOW: sidevoice/sidevoice-core/.github/workflows/rust-t7.yml
  CORE_REF: refs/heads/main

jobs:
  verify-core-inputs:
    name: Verify fixed protected-main Core inputs
    if: github.event_name == 'pull_request_target' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      # Deliberately no checkout and no code from the candidate SHA in this job.
      - name: Download and verify the pinned Core producer artifact
        env:
          GH_TOKEN: ${{ secrets.SIDEVOICE_CORE_ACTIONS_READ }}
          GH_PROMPT_DISABLED: '1'
          CORE_INPUTS: ${{ runner.temp }}/core-inputs
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'SIDEVOICE_CORE_ACTIONS_READ is required for protected Core artifact access' >&2; exit 1; }

          RUN_JSON="$(gh run view "$CORE_RUN_ID" --repo "$CORE_REPOSITORY" --json headSha,headBranch,status,conclusion)"
          printf '%s' "$RUN_JSON" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const run = JSON.parse(input);
              if (run.headSha !== process.env.CORE_SOURCE_SHA || run.headBranch !== "main"
                  || run.status !== "completed" || run.conclusion !== "success") {
                throw new Error("pinned Core producer run is not successful protected-main evidence");
              }
            });
          '

          mkdir -p "$CORE_INPUTS"
          gh run download "$CORE_RUN_ID" --repo "$CORE_REPOSITORY" \
            --name rust-native-signed-inputs --dir "$CORE_INPUTS"

          for asset in native-core-manifest.json \
            "sidevoice-core-rust-${CORE_SOURCE_SHA}-macos-aarch64.tar.zst" \
            "sidevoice-core-rust-${CORE_SOURCE_SHA}-linux-x86_64.tar.zst" \
            "sidevoice-core-rust-${CORE_SOURCE_SHA}-linux-aarch64.tar.zst"; do
            gh attestation verify "$CORE_INPUTS/$asset" \
              --repo "$CORE_REPOSITORY" \
              --bundle "$CORE_INPUTS/$asset.sigstore.json" \
              --signer-workflow "$CORE_WORKFLOW" \
              --source-ref "$CORE_REF" \
              --source-digest "$CORE_SOURCE_SHA" \
              --deny-self-hosted-runners
          done

          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, statSync } = require('node:fs');
          const path = require('node:path');
          const expected = [
            ['native-core-manifest.json', 835, '537f834f1ce1e0135178d6b52310ad37c721fea1cc9dd15874e685c7498f8deb'],
            [`sidevoice-core-rust-${process.env.CORE_SOURCE_SHA}-macos-aarch64.tar.zst`, 23365450, '7a1fa3483074257fb3235086a1ce22b89c8f9bf4810260c2c0ab8a1d6a1e7e9c'],
            [`sidevoice-core-rust-${process.env.CORE_SOURCE_SHA}-linux-x86_64.tar.zst`, 26194457, 'd494218efe81be0385d2394fbaf1ccdb3e9da7868a5a41319608456ef225bbe0'],
            [`sidevoice-core-rust-${process.env.CORE_SOURCE_SHA}-linux-aarch64.tar.zst`, 25342648, '7779e9881a9442624fb6140f33f9e4ec4c59f2576810482fca14f35a87994ffa'],
          ];
          for (const [name, size, sha256] of expected) {
            const file = path.join(process.env.CORE_INPUTS, name);
            const bytes = readFileSync(file);
            const actual = createHash('sha256').update(bytes).digest('hex');
            if (statSync(file).size !== size || actual !== sha256 || statSync(`${file}.sigstore.json`).size === 0) {
              throw new Error(`pinned Core input differs: ${name}`);
            }
          }
          NODE
      - name: Upload only the verified pinned Core inputs
        uses: actions/upload-artifact@v4
        with:
          name: verified-rust-core-inputs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-inputs/native-core-manifest.json
            ${{ runner.temp }}/core-inputs/native-core-manifest.json.sigstore.json
            ${{ runner.temp }}/core-inputs/sidevoice-core-rust-${{ env.CORE_SOURCE_SHA }}-macos-aarch64.tar.zst
            ${{ runner.temp }}/core-inputs/sidevoice-core-rust-${{ env.CORE_SOURCE_SHA }}-macos-aarch64.tar.zst.sigstore.json
            ${{ runner.temp }}/core-inputs/sidevoice-core-rust-${{ env.CORE_SOURCE_SHA }}-linux-x86_64.tar.zst
            ${{ runner.temp }}/core-inputs/sidevoice-core-rust-${{ env.CORE_SOURCE_SHA }}-linux-x86_64.tar.zst.sigstore.json
            ${{ runner.temp }}/core-inputs/sidevoice-core-rust-${{ env.CORE_SOURCE_SHA }}-linux-aarch64.tar.zst
            ${{ runner.temp }}/core-inputs/sidevoice-core-rust-${{ env.CORE_SOURCE_SHA }}-linux-aarch64.tar.zst.sigstore.json
          if-no-files-found: error
          retention-days: 1

  consumer:
    name: ${{ matrix.target }} candidate build and tests
    needs: verify-core-inputs
    if: github.event_name == 'pull_request_target' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-aarch64
            archive: sidevoice-core-rust-b41840e41e3eb81905d285514c7deb35bd8efe57-macos-aarch64.tar.zst
            archive_size: 23365450
            archive_sha256: 7a1fa3483074257fb3235086a1ce22b89c8f9bf4810260c2c0ab8a1d6a1e7e9c
          - runner: ubuntu-24.04
            target: linux-x86_64
            archive: sidevoice-core-rust-b41840e41e3eb81905d285514c7deb35bd8efe57-linux-x86_64.tar.zst
            archive_size: 26194457
            archive_sha256: d494218efe81be0385d2394fbaf1ccdb3e9da7868a5a41319608456ef225bbe0
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            archive: sidevoice-core-rust-b41840e41e3eb81905d285514c7deb35bd8efe57-linux-aarch64.tar.zst
            archive_size: 25342648
            archive_sha256: 7779e9881a9442624fb6140f33f9e4ec4c59f2576810482fca14f35a87994ffa
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
      CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    steps:
      - name: Check out the exact candidate commit without persisted credentials
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CANDIDATE_REPOSITORY }}
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify the checked-out commit matches the requested full SHA
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Download the same-run verified Core inputs
        uses: actions/download-artifact@v4
        with:
          name: verified-rust-core-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/core-inputs
      - name: Recheck fixed Core pin and exact artifact membership
        env:
          CORE_TARGET: ${{ matrix.target }}
          CORE_ARCHIVE: ${{ matrix.archive }}
          CORE_ARCHIVE_SIZE: ${{ matrix.archive_size }}
          CORE_ARCHIVE_SHA256: ${{ matrix.archive_sha256 }}
          CORE_INPUTS: ${{ runner.temp }}/core-inputs
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const { readdirSync, readFileSync, statSync } = require('node:fs');
          const path = require('node:path');
          const root = process.env.CORE_INPUTS;
          const sha = 'b41840e41e3eb81905d285514c7deb35bd8efe57';
          const names = [
            'native-core-manifest.json', 'native-core-manifest.json.sigstore.json',
            `sidevoice-core-rust-${sha}-macos-aarch64.tar.zst`,
            `sidevoice-core-rust-${sha}-macos-aarch64.tar.zst.sigstore.json`,
            `sidevoice-core-rust-${sha}-linux-x86_64.tar.zst`,
            `sidevoice-core-rust-${sha}-linux-x86_64.tar.zst.sigstore.json`,
            `sidevoice-core-rust-${sha}-linux-aarch64.tar.zst`,
            `sidevoice-core-rust-${sha}-linux-aarch64.tar.zst.sigstore.json`,
          ].sort();
          assert.deepEqual(readdirSync(root).sort(), names, 'verified artifact has exact fixed membership');
          const check = (name, size, expected) => {
            const file = path.join(root, name);
            const bytes = readFileSync(file);
            assert.equal(statSync(file).size, Number(size), `${name} size`);
            assert.equal(createHash('sha256').update(bytes).digest('hex'), expected, `${name} SHA-256`);
          };
          check('native-core-manifest.json', 835, '537f834f1ce1e0135178d6b52310ad37c721fea1cc9dd15874e685c7498f8deb');
          check(process.env.CORE_ARCHIVE, process.env.CORE_ARCHIVE_SIZE, process.env.CORE_ARCHIVE_SHA256);
          for (const name of names.filter(value => value.endsWith('.sigstore.json'))) {
            assert.ok(statSync(path.join(root, name)).size > 0, `${name} is nonempty`);
          }
          const manifest = JSON.parse(readFileSync(path.join(root, 'native-core-manifest.json'), 'utf8'));
          assert.equal(manifest.source_sha, sha);
          assert.equal(manifest.bundles[process.env.CORE_TARGET].name, process.env.CORE_ARCHIVE);
          assert.equal(manifest.bundles[process.env.CORE_TARGET].size, Number(process.env.CORE_ARCHIVE_SIZE));
          assert.equal(manifest.bundles[process.env.CORE_TARGET].sha256, process.env.CORE_ARCHIVE_SHA256);
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: v22.23.3
          cache: npm
      - run: test "$(node --version)" = v22.23.3
      - run: npm ci
      - name: Build this target SEA with its signed native Core asset
        env:
          SIDEVOICE_BUILD_SEA: '1'
          SIDEVOICE_REQUIRE_RUST_CORE: '1'
          SIDEVOICE_CONNECTOR_SHA: ${{ env.CANDIDATE_SHA }}
          SIDEVOICE_RUST_CORE_RUN_ID: ${{ env.CORE_RUN_ID }}
          SIDEVOICE_RUST_CORE_SOURCE_SHA: ${{ env.CORE_SOURCE_SHA }}
          SIDEVOICE_RUST_CORE_TARGET: ${{ matrix.target }}
          SIDEVOICE_RUST_CORE_MANIFEST: ${{ runner.temp }}/core-inputs/native-core-manifest.json
          SIDEVOICE_RUST_CORE_MANIFEST_SIGSTORE: ${{ runner.temp }}/core-inputs/native-core-manifest.json.sigstore.json
          SIDEVOICE_RUST_CORE_ARCHIVE: ${{ runner.temp }}/core-inputs/${{ matrix.archive }}
          SIDEVOICE_RUST_CORE_ARCHIVE_SIGSTORE: ${{ runner.temp }}/core-inputs/${{ matrix.archive }}.sigstore.json
          SIDEVOICE_TUF_CACHE: ${{ runner.temp }}/sidevoice-tuf
        run: npm run build:sea -w @sidevoice/uplink
      - name: Run candidate tests and the real signed Core offline stage/self-test
        env:
          SIDEVOICE_RUST_CORE_TARGET: ${{ matrix.target }}
          SIDEVOICE_RUST_CORE_MANIFEST: ${{ runner.temp }}/core-inputs/native-core-manifest.json
          SIDEVOICE_RUST_CORE_MANIFEST_SIGSTORE: ${{ runner.temp }}/core-inputs/native-core-manifest.json.sigstore.json
          SIDEVOICE_RUST_CORE_ARCHIVE: ${{ runner.temp }}/core-inputs/${{ matrix.archive }}
          SIDEVOICE_RUST_CORE_ARCHIVE_SIGSTORE: ${{ runner.temp }}/core-inputs/${{ matrix.archive }}.sigstore.json
          SIDEVOICE_TUF_CACHE: ${{ runner.temp }}/sidevoice-tuf
        run: npm test -w @sidevoice/uplink
