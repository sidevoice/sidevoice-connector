name: R4-b Node SEA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r4-sea-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sea:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-aarch64
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: v22.23.3
          cache: npm
      - run: test "$(node --version)" = v22.23.3
      - run: npm ci
      # Only the protected main ref may consume signed nightly inputs or emit a production candidate.
      # Pull requests and feature-branch dispatches still exercise native SEA tests without production pins.
      - id: core
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/core"
          gh release download nightly -R sidevoice/sidevoice-core -D "$DIR" -p core-manifest.json -p core-manifest.json.sigstore.json
          test -s "$DIR/core-manifest.json"
          test -s "$DIR/core-manifest.json.sigstore.json"
          echo "manifest=$DIR/core-manifest.json" >> "$GITHUB_OUTPUT"
          echo "manifest_sigstore=$DIR/core-manifest.json.sigstore.json" >> "$GITHUB_OUTPUT"
          echo "channel=nightly" >> "$GITHUB_OUTPUT"
          echo "build_seq=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "require_manifest=1" >> "$GITHUB_OUTPUT"
      - name: Build this runner's CommonJS SEA
        env:
          SIDEVOICE_CORE_MANIFEST: ${{ steps.core.outputs.manifest }}
          SIDEVOICE_CORE_MANIFEST_SIGSTORE: ${{ steps.core.outputs.manifest_sigstore }}
          SIDEVOICE_REQUIRE_CORE_MANIFEST: ${{ steps.core.outputs.require_manifest }}
          SIDEVOICE_CHANNEL: ${{ steps.core.outputs.channel }}
          SIDEVOICE_BUILD_SEQ: ${{ steps.core.outputs.build_seq }}
        run: npm run build:sea -w @sidevoice/uplink
      - name: Run SEA, Sigstore, TUF, archive and self-spawn tests
        run: npm test -w @sidevoice/uplink
      - name: Record the built executable size
        env:
          SEA_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module -e 'import { stat, appendFile } from "node:fs/promises"; import path from "node:path"; const f=path.join("packages/connector/dist-sea",process.env.SEA_TARGET,"sidevoice"); const s=await stat(f); console.log(`${f}: ${s.size} bytes`); await appendFile(process.env.GITHUB_STEP_SUMMARY,`- ${process.env.SEA_TARGET}: ${s.size} bytes\n`);'
      - name: Verify genuine macOS SEA metadata before publishing the test-passed artifact
        if: matrix.target == 'macos-aarch64' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SIDEVOICE_SEA_EXECUTABLE: packages/connector/dist-sea/macos-aarch64/sidevoice
          SIDEVOICE_CORE_MANIFEST: ${{ steps.core.outputs.manifest }}
          SIDEVOICE_CORE_MANIFEST_SIGSTORE: ${{ steps.core.outputs.manifest_sigstore }}
        run: node packages/connector/sea-artifact.mjs verify-build
      - name: Upload the exact signed core inputs used by this tested macOS SEA
        if: matrix.target == 'macos-aarch64' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sidevoice-connector-macos-aarch64-r4b-core-inputs
          path: |
            ${{ steps.core.outputs.manifest }}
            ${{ steps.core.outputs.manifest_sigstore }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload the production macOS arm64 SEA
        if: matrix.target == 'macos-aarch64' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: connector-artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidevoice-connector-macos-aarch64-r4b
          path: packages/connector/dist-sea/macos-aarch64/sidevoice
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Download the uploaded executable artifact through the Actions consumer path
        if: matrix.target == 'macos-aarch64' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          name: sidevoice-connector-macos-aarch64-r4b
          path: ${{ runner.temp }}/r4-sea-artifact
      - name: Verify the artifact has one root executable with the tested SEA bytes
        if: matrix.target == 'macos-aarch64' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node packages/connector/sea-artifact.mjs verify-copy packages/connector/dist-sea/macos-aarch64/sidevoice "$RUNNER_TEMP/r4-sea-artifact"

  attest-macos:
    name: Attest tested macOS SEA
    needs: sea
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sidevoice-connector-macos-aarch64-r4b
          path: ${{ runner.temp }}/connector-artifact
      - name: Verify the downloaded subject layout
        run: |
          set -euo pipefail
          test "$(find "$RUNNER_TEMP/connector-artifact" -mindepth 1 -maxdepth 1 -type f -printf '%f\n')" = sidevoice
          test -f "$RUNNER_TEMP/connector-artifact/sidevoice"
          chmod 755 "$RUNNER_TEMP/connector-artifact/sidevoice"
      - name: Generate GitHub public-good Sigstore build provenance
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/connector-artifact/sidevoice
      - name: Verify the generated bundle against the exact tested executable and signer identity
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: >-
          gh attestation verify "$RUNNER_TEMP/connector-artifact/sidevoice"
          --repo sidevoice/sidevoice-connector
          --bundle "$BUNDLE"
          --signer-workflow github.com/sidevoice/sidevoice-connector/.github/workflows/r4-sea.yml
          --source-ref refs/heads/main
          --source-digest "$GITHUB_SHA"
          --deny-self-hosted-runners
      - name: Stage the verified Sigstore bundle as a root sidecar
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/provenance-artifact"
          cp "${{ steps.attest.outputs.bundle-path }}" "$RUNNER_TEMP/provenance-artifact/sidevoice.sigstore.json"
          test -s "$RUNNER_TEMP/provenance-artifact/sidevoice.sigstore.json"
      - name: Upload the verified provenance bundle
        uses: actions/upload-artifact@v4
        with:
          name: sidevoice-connector-macos-aarch64-r4b-provenance
          path: ${{ runner.temp }}/provenance-artifact/sidevoice.sigstore.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  desktop-pin:
    name: Verify artifacts and write Desktop pin
    needs: [sea, attest-macos]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: v22.23.3
      - uses: actions/download-artifact@v4
        with:
          name: sidevoice-connector-macos-aarch64-r4b
          path: ${{ runner.temp }}/connector-artifact
      - uses: actions/download-artifact@v4
        with:
          name: sidevoice-connector-macos-aarch64-r4b-core-inputs
          path: ${{ runner.temp }}/core-inputs
      - uses: actions/download-artifact@v4
        with:
          name: sidevoice-connector-macos-aarch64-r4b-provenance
          path: ${{ runner.temp }}/provenance-artifact
      - name: Verify artifact root entries and executable metadata
        env:
          SIDEVOICE_SEA_EXECUTABLE: ${{ runner.temp }}/connector-artifact/sidevoice
          SIDEVOICE_CORE_MANIFEST: ${{ runner.temp }}/core-inputs/core-manifest.json
          SIDEVOICE_CORE_MANIFEST_SIGSTORE: ${{ runner.temp }}/core-inputs/core-manifest.json.sigstore.json
        run: |
          set -euo pipefail
          chmod 755 "$SIDEVOICE_SEA_EXECUTABLE"
          node packages/connector/sea-artifact.mjs verify-entries "$RUNNER_TEMP/connector-artifact" sidevoice
          node packages/connector/sea-artifact.mjs verify-entries "$RUNNER_TEMP/core-inputs" core-manifest.json core-manifest.json.sigstore.json
          node packages/connector/sea-artifact.mjs verify-entries "$RUNNER_TEMP/provenance-artifact" sidevoice.sigstore.json
      - name: Verify provenance bundle against the exact downloaded SEA
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify "$RUNNER_TEMP/connector-artifact/sidevoice"
          --repo sidevoice/sidevoice-connector
          --bundle "$RUNNER_TEMP/provenance-artifact/sidevoice.sigstore.json"
          --signer-workflow github.com/sidevoice/sidevoice-connector/.github/workflows/r4-sea.yml
          --source-ref refs/heads/main
          --source-digest "$GITHUB_SHA"
          --deny-self-hosted-runners
      - name: Read the official run artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/run-artifacts.json"
      - name: Write the signed-manifest and provenance-bound Desktop pin
        env:
          SIDEVOICE_SEA_EXECUTABLE: ${{ runner.temp }}/connector-artifact/sidevoice
          SIDEVOICE_CORE_MANIFEST: ${{ runner.temp }}/core-inputs/core-manifest.json
          SIDEVOICE_CORE_MANIFEST_SIGSTORE: ${{ runner.temp }}/core-inputs/core-manifest.json.sigstore.json
          SIDEVOICE_ARTIFACTS_JSON: ${{ runner.temp }}/run-artifacts.json
          SIDEVOICE_PIN_OUTPUT: ${{ runner.temp }}/connector-pin.json
        run: node packages/connector/sea-artifact.mjs write-pin
      - name: Upload Desktop pin metadata
        uses: actions/upload-artifact@v4
        with:
          name: sidevoice-connector-macos-aarch64-r4b-pin
          path: ${{ runner.temp }}/connector-pin.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
