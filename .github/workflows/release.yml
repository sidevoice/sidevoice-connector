name: Release

# A release is a tag v<version>: the whole CI runs on that tag, the server image
# is published under the version, the client goes to npm, and the GitHub release
# is opened last, so it only ever describes things that were actually published.
# Cutting one: scripts/version.sh set <version>, merge, then tag.
# See docs/RELEASING.md. Pushes to main publish :latest from ci.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: The tag and the manifests agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/version.sh check "${GITHUB_REF_NAME#v}"

  verify:
    name: Verified build
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write

  npm:
    name: Client to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Trusted publishing, and the provenance it attaches.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Node 22 still bundles npm 10, and publishing over OIDC needs 11.5.1 or
      # later: without this the release authenticates with nothing and fails.
      - run: npm install -g npm@latest
      # Staged, not live. The version waits in npm's queue until a maintainer
      # approves it from a trusted device, because this is the one step here
      # that cannot be taken back: an npm version is spent for ever, even if it
      # is unpublished. The registry enforces it too — the trusted publisher is
      # configured stage-only, so a direct publish from this workflow is
      # refused. Authentication is OIDC; there is no token to hold.
      #
      # A pre-release must not become what `npm install` picks: it goes out
      # under the `next` tag, and only a final release moves `latest`.
      - run: |
          case "${GITHUB_REF_NAME#v}" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          npm stage publish --access public --provenance --tag "$tag"
        working-directory: packages/connector
      - name: Say how to land it
        run: |
          {
            echo "### The client is staged, not live"
            echo
            echo "It becomes installable when you approve it:"
            echo
            echo '```sh'
            echo "npm stage list @sidevoice/uplink"
            echo "npm stage approve <stage-id>"
            echo '```'
            echo
            echo "Or on npmjs.com: the package → Staged Packages. Approving asks"
            echo "for your second factor, which is the point of staging."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    needs: [verify, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the notes are the commits since the previous tag
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack the client
        run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: packages/connector
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ needs.verify.outputs.image-digest }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          notes=$(mktemp)
          scripts/release-notes.sh "$previous" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > "$notes"
          cat >> "$notes" <<NOTES
          ## Run the room

          \`\`\`sh
          docker run -d --name sidevoice -p 127.0.0.1:8767:8767 -v sidevoice-data:/data \\
            $IMAGE:$version
          \`\`\`

          Pinned by digest: \`$IMAGE@$IMAGE_DIGEST\` (linux/amd64 and linux/arm64).
          Room data lives in \`/data\`. The room has no access control: put it
          behind a proxy that adds TLS and authentication before exposing it.

          ## Connect a conversation

          On the machine where your agent runs:

          \`\`\`sh
          npx -y @sidevoice/uplink@$version install
          \`\`\`

          Then, in a new conversation, ask the agent to join the room; the first
          time it asks you for the code the room shows under "Emparejar conector".

          The client is **staged** on npm and becomes installable once a
          maintainer approves it — npmjs.com → the package → Staged Packages.
          Until then, install it from the tarball attached below, or run it from
          a checkout. See \`docs/INSTALL.md\`.
          NOTES
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/*.tgz \
            --title "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes-file "$notes" $prerelease
