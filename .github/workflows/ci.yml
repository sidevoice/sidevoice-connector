name: CI

# What runs when (RELEASING.md):
# - pull request: the client's suite on Linux and a dry run of the package. Nothing is packaged.
# - push to main, manual run: the same, then the npm tarball with the core's wheel inside; a green run on main
#   replaces the `nightly` pre-release.
# - a release (called by release-please.yml with the tag it created): the same, attached to that draft release;
#   release-please.yml then takes it to npm and publishes the release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      core-ref:
        description: The sidevoice-core commit the interop job runs against (default below).
        type: string
        required: false
  workflow_call:
    inputs:
      release-tag:
        description: The draft release release-please created (vX.Y.Z); its assets are built from that tag.
        type: string
        required: true

permissions:
  contents: read

env:
  # The real core the interop job runs against: R1-a (sidevoice/sidevoice-core#29) until it merges, then main.
  CORE_REF: ${{ inputs.core-ref || '64274208ccffbdbdbd3728b0a718bdd1f8141350' }}

concurrency:
  # Per ref. A release (github.workflow is the caller's, release-please) never shares a group with a push.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (Node)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The published client is one bundled file, so it is built before anything checks or packs
      # it: `npm pack` would build it again through `prepack`, and a suite that ran first would be
      # testing a `dist/` from whenever somebody last built by hand.
      - run: npm run build
      # One file per invocation: `node --check` takes a single script and treats the rest as its arguments,
      # so a list only ever checked the first name (and a deleted file went unnoticed for two releases).
      - run: for f in packages/connector/*.mjs packages/connector/dist/*.mjs; do node --check "$f"; done
      - run: npm test
      # The trust boundary is the OS user (design §4.1): another user on this machine must reach neither the core's
      # socket — the connector link and the local routes are only there — nor the connector's, and the core's TCP
      # listener must not offer the link. The data dir is opened up on purpose, so the core's own 0700 directory and
      # the sockets' own modes are what refuse, not the home directory. The fake core plays the core.
      - name: A second OS user cannot reach this user's core or connector
        working-directory: packages/connector
        run: |
          set -euo pipefail
          printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$(command -v node)" "$PWD/test/fake-sidevoice-core.mjs" > "$RUNNER_TEMP/sidevoice-core"
          chmod 755 "$RUNNER_TEMP/sidevoice-core"
          export SIDEVOICE_SERVICE_MANAGER=none SIDEVOICE_CORE_BIN="$RUNNER_TEMP/sidevoice-core" SIDEVOICE_CORE_PORT=0
          node cli.mjs connector --supervise &
          for i in $(seq 1 60); do [ -f "$HOME/.sidevoice/core/core.json" ] && break; sleep 1; done
          url=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.env.HOME + '/.sidevoice/core/core.json', 'utf8')).url)")
          chmod o+x "$HOME"; chmod 755 "$HOME/.sidevoice"
          ls -la "$HOME/.sidevoice" "$HOME/.sidevoice/core" || true
          sudo useradd -m sidevoice-other
          install -m 644 test/second-uid-probe.mjs /tmp/second-uid-probe.mjs
          sudo -u sidevoice-other "$(command -v node)" /tmp/second-uid-probe.mjs "$HOME/.sidevoice" "$url"
          kill %1
      - name: Package contents (dry run)
        run: npm pack --dry-run
        working-directory: packages/connector

  # The connector against the real core, not the fake: it supervises it, links on its socket (no Origin, a loopback
  # Host), registers a binding and gets a device code minted there, and finds the link gone from TCP. Required here:
  # a core that is not there fails the job instead of skipping the test.
  interop-core:
    name: Interop with the real core
    if: ${{ !inputs.release-tag }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sidevoice/sidevoice-core
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - name: The core, installed as its own CI installs it
        working-directory: core
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e .
          .venv/bin/python -m sidevoice_core.server --self-test
      - name: Interop test (required)
        env:
          SIDEVOICE_INTEROP_CORE_DIR: ${{ github.workspace }}/core
          SIDEVOICE_INTEROP_REQUIRED: '1'
        run: node --test --test-name-pattern=interop packages/connector/test/test_core.mjs

  # The node service under the real service managers, end to end (packages/connector/test/service-integration.mjs):
  # install with no agents → the core running with no harness → killed → backoff → running → a login, approximated
  # → stop (the person's; the launcher refuses) → start → uninstall with a client connected → no job, no process,
  # no socket, and nothing after the next login. The fake core plays the core.
  service-linux:
    name: Node service (systemd user manager)
    needs: client
    if: ${{ !inputs.release-tag }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The runner's user has no login session, so no user manager: lingering gives it one, as on a headless machine.
      - name: A user manager for the runner
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$USER"
          for i in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - run: systemctl --user show-environment >/dev/null && systemctl --user is-system-running || true
      - run: node packages/connector/test/service-integration.mjs
      # The supervisor's hand-off under the manager: an installer killed right after committing a new selection; the
      # supervisor running the old one hands over through 'service reload' and the manager ends up running the new one —
      # and a selection whose core cannot serve is rolled back, under the manager, to the one before.
      - name: Hand-off to a new selection, and its rollback, under the manager
        run: node packages/connector/test/service-handoff.mjs

  service-macos:
    name: Node service (launchd)
    needs: client
    if: ${{ !inputs.release-tag }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: launchctl print "gui/$(id -u)" >/dev/null && echo "gui domain present"
      # The locks are the kernel's: on macOS the lock file opened O_EXLOCK|O_NONBLOCK through libuv. Proved here, on the
      # platform: three contenders never hold it at once, a SIGKILLed holder frees it at once, a held lock is refused.
      - name: Kernel-held locks on macOS
        run: node --test --test-name-pattern="^lock|install lock" packages/connector/test/test_security.mjs
      - run: node packages/connector/test/service-integration.mjs
      # The supervisor's hand-off under the manager: an installer killed right after committing a new selection; the
      # supervisor running the old one hands over through 'service reload' and the manager ends up running the new one —
      # and a selection whose core cannot serve is rolled back, under the manager, to the one before.
      - name: Hand-off to a new selection, and its rollback, under the manager
        run: node packages/connector/test/service-handoff.mjs

  package:
    name: npm tarball with the core inside
    needs: client
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      # Where the assets go: the release that called this, or the rolling `nightly` pre-release on a push to main.
      publish: ${{ steps.kind.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: kind
        run: echo "publish=${{ inputs.release-tag && 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'nightly' || '' }}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: The core's wheel this version pins (a release takes the core's vX.Y.Z, anything else its nightly)
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.kind.outputs.publish }}
        run: |
          set -euo pipefail
          CORE_VERSION=$(node --input-type=module -e "import { CORE_VERSION } from './packages/connector/core.mjs'; console.log(CORE_VERSION)")
          CORE_TAG=$([ "$KIND" = release ] && echo "v$CORE_VERSION" || echo nightly)
          WHEEL="sidevoice_core-${CORE_VERSION}-py3-none-any.whl"
          DIR="$RUNNER_TEMP/core"
          gh release download "$CORE_TAG" -R sidevoice/sidevoice-core -D "$DIR" -p 'sidevoice_core-*-py3-none-any.whl' -p SHA256SUMS
          if [ ! -f "$DIR/$WHEEL" ]; then
            echo "::error::sidevoice-core's $CORE_TAG carries $(cd "$DIR" && ls -- *.whl), but packages/connector/core.mjs pins CORE_VERSION $CORE_VERSION."
            exit 1
          fi
          grep -q "  $WHEEL\$" "$DIR/SHA256SUMS"
          (cd "$DIR" && sha256sum -c --ignore-missing SHA256SUMS)
          echo "wheel=$DIR/$WHEEL" >> "$GITHUB_OUTPUT"
          echo "core=$CORE_TAG" >> "$GITHUB_OUTPUT"
      - name: Pack the client, the wheel inside (prepack runs `npm run build`, which takes SIDEVOICE_CORE_WHEEL)
        working-directory: packages/connector
        env:
          SIDEVOICE_CORE_WHEEL: ${{ steps.core.outputs.wheel }}
          KIND: ${{ steps.kind.outputs.publish }}
          # Which build this is, for the installer's ordering (install-txn.mjs): a nightly carries the version of the
          # last release, so two nightlies of one version are ordered by this run number. build.mjs stamps both into
          # dist/package.json; the package's own manifest is stamped here too.
          SIDEVOICE_CHANNEL: ${{ steps.kind.outputs.publish == 'nightly' && 'nightly' || 'release' }}
          SIDEVOICE_BUILD_SEQ: ${{ github.run_number }}
        run: |
          set -euo pipefail
          npm pkg set "sidevoice.channel=$SIDEVOICE_CHANNEL"
          npm pkg set "sidevoice.build_seq=$SIDEVOICE_BUILD_SEQ" --json
          mkdir -p "$GITHUB_WORKSPACE/dist-release"
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist-release"
          TGZ=$(ls "$GITHUB_WORKSPACE"/dist-release/sidevoice-uplink-*.tgz)
          WHEEL=$(basename "$SIDEVOICE_CORE_WHEEL")
          tar -tzf "$TGZ" | grep -x 'package/dist/cli.mjs' >/dev/null
          tar -xzOf "$TGZ" package/dist/package.json | node -e "const m = JSON.parse(require('fs').readFileSync(0, 'utf8')); if (m.sidevoice?.channel !== process.env.SIDEVOICE_CHANNEL || m.sidevoice?.build_seq !== Number(process.env.SIDEVOICE_BUILD_SEQ)) { console.error('unstamped manifest', m.sidevoice); process.exit(1); }"
          tar -xzOf "$TGZ" "package/dist/core/$WHEEL" | cmp - "$SIDEVOICE_CORE_WHEEL"
          if [ "$KIND" = nightly ]; then
            # The nightly carries the version of the last release, so it says it is not that version.
            mv "$TGZ" "${TGZ%.tgz}-nightly.tgz"
          fi
          cd "$GITHUB_WORKSPACE/dist-release"
          sha256sum -- * > SHA256SUMS
          ls -la; cat SHA256SUMS
          echo "Core wheel: $WHEEL from sidevoice/sidevoice-core ${{ steps.core.outputs.core }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sidevoice-connector-dist
          path: dist-release/
          retention-days: 7
          if-no-files-found: error

  # Only after the suite and the package passed. Pull requests never get here. A release is only attached
  # here, as a draft: release-please.yml publishes it after npm.
  publish:
    name: Attach (release) or publish (nightly)
    needs: package
    if: needs.package.outputs.publish != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.release-tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sidevoice-connector-dist
          path: assets
      - name: Attach to the draft release
        if: needs.package.outputs.publish == 'release'
        run: gh release upload "$TAG" assets/* --clobber
      - name: Replace the nightly pre-release (move its tag here, replace every asset)
        if: needs.package.outputs.publish == 'nightly'
        env:
          WHEN: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
          fi
          NOTES="Snapshot of \`main\` at $GITHUB_SHA (committed $WHEN), with sidevoice-core's nightly wheel inside. Not a versioned release: the \`nightly\` tag moves to every commit on \`main\` whose CI passes, and these assets are replaced each time. It is never published to npm. Versioned releases are the \`vX.Y.Z\` ones."
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "Nightly (main)" --notes "$NOTES" --prerelease --latest=false
            gh release upload nightly assets/* --clobber
            # Anything left from an older snapshot that this one did not replace (the tarball is named after the version).
            gh release view nightly --json assets -q '.assets[].name' | while read -r name; do
              [ -e "assets/$name" ] || gh release delete-asset nightly "$name" --yes
            done
          else
            gh release create nightly assets/* --verify-tag --title "Nightly (main)" --notes "$NOTES" \
              --prerelease --latest=false
          fi
