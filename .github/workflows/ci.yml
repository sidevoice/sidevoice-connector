name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  room:
    name: Room (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=apps/server python -m unittest discover -s apps/server/tests -p 'test_*.py'

  client:
    name: Client (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node --check packages/connector/cli.mjs packages/connector/mcp.mjs packages/connector/connector.mjs packages/connector/adapters.mjs packages/connector/pair.mjs
      - run: npm test
      - name: Package contents (dry run)
        run: npm pack --dry-run
        working-directory: packages/connector
