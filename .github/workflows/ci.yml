name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  room:
    name: Room (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s voice_poc -p 'test_*.py'

  client:
    name: Client (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check connector/cli.mjs connector/mcp.mjs connector/connector.mjs connector/adapters.mjs connector/pair.mjs
      - run: node --test connector/test/test_connector.mjs voice_poc/test_*.cjs
      - name: Package contents (dry run)
        run: npm pack --dry-run
        working-directory: connector
