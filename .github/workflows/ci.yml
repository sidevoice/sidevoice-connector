name: CI

# The suites, and the server image they gate. A pull request builds the image
# without publishing it; main publishes :latest; the release workflow calls this
# one on a tag, so nothing is published under a version that was not tested.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    outputs:
      image-version:
        description: The primary tag the server image was published under.
        value: ${{ jobs.manifest.outputs.version }}
      image-digest:
        description: The digest of the published image.
        value: ${{ jobs.manifest.outputs.digest }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # One list of tag rules for the per-platform builds and for the manifest that
  # joins them: latest follows main, stable follows the newest final release,
  # and every release keeps its X.Y.Z and X.Y. A pre-release moves neither
  # pointer.
  IMAGE_TAGS: |
    type=raw,value=latest,enable={{is_default_branch}}
    type=sha,prefix=sha-,enable={{is_default_branch}}
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
    type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

jobs:
  room:
    name: Room (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=apps/server python -m unittest discover -s apps/server/tests -p 'test_*.py'

  client:
    name: Client (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node --check packages/connector/cli.mjs packages/connector/mcp.mjs packages/connector/connector.mjs packages/connector/adapters.mjs packages/connector/pair.mjs
      - run: npm test
      - name: Package contents (dry run)
        run: npm pack --dry-run
        working-directory: packages/connector

  image:
    name: Server image (${{ matrix.platform }})
    needs: [room, client]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Name this platform
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the GitHub container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.IMAGE_TAGS }}
      # Each platform is pushed by digest alone and the manifest job below joins
      # them under the tags, so no tag ever points at half a pair.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # An SBOM and provenance travel with what is published; a pull request
          # builds to the cache, which carries neither.
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
      - name: Record this platform's digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: Hand the digest to the manifest job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish the image
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.published.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.IMAGE_TAGS }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join both platforms under the tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' $(ls))
      - name: Report what was published
        id: published
        run: |
          reference="${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
          digest=$(docker buildx imagetools inspect "$reference" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Server image"
            echo
            echo '```sh'
            echo "docker pull ${{ env.IMAGE }}@$digest"
            echo '```'
            echo
            echo "Tags: $(jq -cr '.tags | join(", ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          } >> "$GITHUB_STEP_SUMMARY"
