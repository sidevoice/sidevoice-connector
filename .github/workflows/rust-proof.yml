name: Rust connector proof

on:
  pull_request:
    paths:
      - 'packages/connector-rust/**'
      - 'packages/connector/messages/en.mjs'
      - 'packages/connector/messages/agent-errors.json'
      - '.github/workflows/rust-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-macos:
    name: Native macOS arm64 service proof
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/connector-rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact pull request head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -c 'import os, subprocess, sys; actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(); expected = os.environ["EXPECTED_HEAD"]; print("checked out", actual, "expected", expected); sys.exit(actual != expected)'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/connector-rust
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: cargo fmt --all --check
      - uses: actions/upload-artifact@v4
        with:
          name: sidevoice-rust-proof-macos-arm64
          path: packages/connector-rust/target/release/sidevoice-rust-proof
          if-no-files-found: error
          retention-days: 7

  launchd-integration:
    name: Pinned Core and real launchd private-profile proof
    needs: native-macos
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact pull request head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -c 'import os, subprocess, sys; actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(); expected = os.environ["EXPECTED_HEAD"]; print("checked out", actual, "expected", expected); sys.exit(actual != expected)'
      - uses: actions/checkout@v4
        with:
          repository: sidevoice/sidevoice-core
          ref: 4d6df599239602954a3c6ab503c642eeeab5ca12
          path: core
      - uses: actions/download-artifact@v4
        with:
          name: sidevoice-rust-proof-macos-arm64
          path: proof-bin
      - uses: astral-sh/setup-uv@v6
      - run: chmod 700 proof-bin/sidevoice-rust-proof
      - name: Real Core v3 and launchd lifecycle in a private profile
        env:
          SIDEVOICE_CORE_SOURCE: ${{ github.workspace }}/core
          SIDEVOICE_CORE_SHA: 4d6df599239602954a3c6ab503c642eeeab5ca12
          SIDEVOICE_RUST_PROOF_BIN: ${{ github.workspace }}/proof-bin/sidevoice-rust-proof
        run: python3 packages/connector-rust/test/service_launchd.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidevoice-rust-launchd-evidence
          path: |
            ${{ runner.temp }}/sidevoice-rust-launchd-profile/service-evidence.json
            ${{ runner.temp }}/sidevoice-rust-launchd-profile/sidevoice/service/*.log
            ${{ runner.temp }}/sidevoice-rust-launchd-profile/sidevoice/core/core-app.log
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: Native Rust proof
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/connector-rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact pull request head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -c 'import os, subprocess, sys; actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(); expected = os.environ["EXPECTED_HEAD"]; print("checked out", actual, "expected", expected); sys.exit(actual != expected)'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/connector-rust
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: cargo fmt --all --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned Codex CLI in the job temp directory
        run: npm install --prefix "$RUNNER_TEMP/codex-cli" --no-audit --no-fund @openai/codex@0.160.0
      - name: Real Codex CLI registration in a disposable profile
        env:
          SIDEVOICE_RUST_PROOF_BIN: ${{ github.workspace }}/packages/connector-rust/target/release/sidevoice-rust-proof
          SIDEVOICE_CODEX_BIN: ${{ runner.temp }}/codex-cli/node_modules/.bin/codex
        run: python3 test/codex_cli_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: sidevoice-rust-proof-linux-x86_64
          path: packages/connector-rust/target/release/sidevoice-rust-proof
          if-no-files-found: error
          retention-days: 7

  interop-core:
    name: Rust proof with real Core v3 and modelled Codex queue
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact pull request head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -c 'import os, subprocess, sys; actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(); expected = os.environ["EXPECTED_HEAD"]; print("checked out", actual, "expected", expected); sys.exit(actual != expected)'
      - uses: actions/checkout@v4
        with:
          repository: sidevoice/sidevoice-core
          ref: 4d6df599239602954a3c6ab503c642eeeab5ca12
          path: core
      - uses: actions/download-artifact@v4
        with:
          name: sidevoice-rust-proof-linux-x86_64
          path: proof-bin
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: chmod 700 proof-bin/sidevoice-rust-proof
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test packages/connector/test/test_agents.mjs
      - run: uv venv --python 3.12 core/.venv
      - run: uv pip install --python core/.venv/bin/python -e ./core 'websockets>=15,<16'
      - name: Real Core, Core-generated input, receipts and speech
        env:
          SIDEVOICE_CORE_PYTHON: ${{ github.workspace }}/core/.venv/bin/python
          SIDEVOICE_RUST_PROOF_BIN: ${{ github.workspace }}/proof-bin/sidevoice-rust-proof
        run: core/.venv/bin/python packages/connector-rust/test/interop_core.py
