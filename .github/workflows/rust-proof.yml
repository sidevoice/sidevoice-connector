name: Rust connector proof

on:
  pull_request:
    paths:
      - 'packages/connector-rust/**'
      - '.github/workflows/rust-proof.yml'
  workflow_dispatch:
    inputs:
      core-ref:
        description: Core v3 commit or branch for real interoperability
        required: false
        type: string

permissions:
  contents: read

jobs:
  native:
    name: Native Rust proof
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/connector-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/connector-rust
      - run: cargo fmt --all
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: sidevoice-rust-proof-linux-x86_64
          path: packages/connector-rust/target/release/sidevoice-rust-proof
          if-no-files-found: error
          retention-days: 7
