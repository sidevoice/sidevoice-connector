[package]
name = "sidevoice-sigstore-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
publish = false

[dependencies]
base64 = "=0.22.1"
const-oid = "=0.9.6"
hex = "=0.4.3"
jiff = "=0.2.31"
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sigstore-trust-root = { version = "=0.14.0", features = ["tuf"] }
sigstore-tuf = { version = "=0.14.0", features = ["fetch", "rustls"] }
sigstore-types = "=0.14.0"
sigstore-verify = { version = "=0.14.0", features = ["tuf"] }
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread"] }
x509-cert = "=0.2.5"
