# The workspace, and at its root the build tooling run as `cargo xtask <command>` (xtask/src/main.rs, alias in
# .cargo/config.toml). The connector itself is the crate in connector/. release-please gives every package here the
# release's version (RELEASING.md): the root needs a package of its own for that, and the tooling is it.
[package]
name = "xtask"
version = "0.16.0"
edition = "2021"
publish = false
description = "Build tooling for the connector: release archives, their manifest, publishing, and what the tests run against."

[[bin]]
name = "xtask"
path = "xtask/src/main.rs"
test = true

[dependencies]
sidevoice-platform = { workspace = true }
# The DLLs a Windows binary imports (xtask/src/verify.rs), read from its PE file.
object = { version = "0.40", default-features = false, features = ["read_core", "pe", "std"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
# The core version is the workspace `sidevoice-platform` tag (xtask/src/core.rs).
toml = "0.8"
# Programs are found the way the OS finds them, `PATHEXT` included (`npm` is `npm.cmd` on Windows): xtask/src/util.rs.
which = "=8.0.6"
zstd = "0.13"

[workspace]
resolver = "2"
members = ["connector", "testbench"]
# `cargo test`, `cargo clippy` and `cargo fmt` at the root cover the connector, the test bench and the tooling.
default-members = [".", "connector", "testbench"]

[workspace.dependencies]
# Shared platform API and the core release bundled by xtask: one pin for both consumers.
sidevoice-platform = { git = "https://github.com/sidevoice/sidevoice-core", tag = "v0.11.1" }
