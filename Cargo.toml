# The workspace, and at its root the build tooling run as `cargo xtask <command>` (xtask/src/main.rs, alias in
# .cargo/config.toml). The connector itself is packages/connector-rust. release-please gives every package here the
# release's version (RELEASING.md): the root needs a package of its own for that, and the tooling is it.
[package]
name = "xtask"
version = "0.6.0"
edition = "2021"
publish = false
description = "Build tooling for the connector: release archives, their manifest, publishing, and what the tests run against."

[[bin]]
name = "xtask"
path = "xtask/src/main.rs"
test = true

[dependencies]
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"

[workspace]
resolver = "2"
members = ["packages/connector-rust"]
# `cargo test`, `cargo clippy` and `cargo fmt` at the root cover the connector and the tooling.
default-members = [".", "packages/connector-rust"]
