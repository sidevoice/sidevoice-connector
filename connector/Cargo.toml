[package]
name = "sidevoice-connector"
version = "0.15.0"
edition = "2021"
publish = false

[[bin]]
name = "sidevoice-connector"
path = "src/main.rs"

# A developer tool (src/bench/main.rs, README "Test bench"): the connector and the pinned core driven from a local page.
# Not part of the release archive, which carries only the connector.
[[bin]]
name = "sidevoice-bench"
path = "src/bench/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
gethostname = "1"
whoami = "2"
hex = "0.4"
libc = "0.2"
qrcodegen = "1.8"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
ureq = { version = "3", default-features = false, features = ["rustls"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
which = "=8.0.6"
zstd = "0.13"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
# Records written whole (src/platform/fs): a temporary file beside the record, synced, renamed over it.
atomic-write-file = "0.3"
# Processes (src/platform/process): what every OS reads the same (owner, start, command line, parent) and the stop,
# through `sysinfo`; spawning a detached process or a stoppable tree (process group, Job Object) through `process-wrap`.
process-wrap = { version = "10", features = ["tokio1", "process-group", "job-object", "creation-flags", "kill-on-drop"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[dev-dependencies]
# Scratch directories in unit tests (src/test_support.rs).
tempfile = "3"

# Unix: the effective uid (src/platform/user), with no `unsafe` of ours.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

# Windows: this process's user and file owners (src/platform/user). Minimal features; the version the lock already has.
# `windows`: only for the type `process-wrap`'s `CreationFlags` takes (src/platform/process); it is `process-wrap`'s
# own dependency, at its version, so it adds nothing to the build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
windows = { version = "0.62", features = ["Win32_System_Threading"] }
