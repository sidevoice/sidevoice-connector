[package]
name = "sidevoice-connector"
version = "0.18.0"
edition = "2021"
publish = false

[[bin]]
name = "sidevoice-connector"
path = "src/main.rs"

# The windowless launcher of the Windows service jobs (src/background.rs, src/service/background.rs). Built on every OS so
# the workspace stays one build; only the Windows archive ships it (xtask/src/dist.rs).
[[bin]]
name = "sidevoice-background"
path = "src/background.rs"

# The MCP server check (src/adapters/health.rs) against a fake server that is this test's own binary, on every OS. Not
# libtest: it writes its own lines to stdout, where the fake server's protocol goes.
[[test]]
name = "health"
harness = false

[dependencies]
same-file = "1"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
# The login name for the Windows task scheduler (src/platform/service).
whoami = "2"
hex = "0.4"
libc = "0.2"
qrcodegen = "1.8"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
# One JSON message per line on the local channel and an MCP server's stdout (src/frame.rs): `LinesCodec`.
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = "0.30"
ureq = { version = "3", default-features = false, features = ["rustls"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
which = "=8.0.6"
# The Claude desktop app's bundled Claude Code versions, compared as versions (src/adapters/claude/binary.rs).
semver = "1"
# This user's standard data directory per OS (src/data_dir.rs): `~/Library/Application Support`, `$XDG_DATA_HOME`,
# `%LOCALAPPDATA%`.
dirs = "7"
zstd = "0.13"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
# Shared platform API, pinned with the bundled core release in the workspace manifest.
sidevoice-platform = { workspace = true }
# Canonical paths without the `\\?\` prefix Windows gives `canonicalize` (src/platform/uninstall).
dunce = "1"
# Processes (src/platform/process): what every OS reads the same (owner, start, command line, parent) and the stop,
# through `sysinfo`; child execution belongs to `sidevoice-platform`.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Third parties' endpoints (src/platform/foreign): the same transport as the local channel, a Unix socket or a named pipe.
interprocess = { version = "2.4", features = ["tokio"] }

[features]
# What tests do to files and the program never does (`sidevoice-platform`'s `TestFiles`, re-exported as
# `platform::fs::TestFiles`). Enabled for the tests by the dev-dependency on this crate below; never in a release build.
test-support = ["sidevoice-platform/test-support"]

[dev-dependencies]
# Scratch directories in unit tests (src/test_support.rs).
tempfile = "3"
# This crate with `test-support`, for the unit and the integration tests (tests/).
sidevoice-connector = { path = ".", features = ["test-support"] }
ctor = "1"

# Unix: the effective uid (src/platform/service/macos: the launchd domain) and the mode of a directory of ours left open
# (src/platform/owner_only/unix.rs: `fchmod`), with no `unsafe` of ours.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }
# The login shell from the user database (src/platform/env/unix): `getpwuid_r`, no `unsafe` of ours. Already in the lock;
# `user` adds no dependency.
nix = { version = "0.31", default-features = false, features = ["user"] }

# Windows: reparse points and sharing (src/platform/uninstall, src/platform/process) and the Restart Manager
# (src/platform/holders), and the private DACL put back on a directory of ours left open (src/platform/owner_only).
# Minimal features; the version the lock already has.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
# Which file a handle is (src/platform/uninstall): `winapi-util` (walkdir, ripgrep), no `unsafe` of ours.
winapi-util = "0.1"
# The user and machine `Path` a Windows login has instead of a login shell's (src/platform/env/windows.rs).
winreg = "0.55"
# The Task Scheduler task's XML (src/platform/service/windows.rs), written and read through serde.
quick-xml = { version = "0.42", features = ["serialize"] }

# macOS: the LaunchAgent (src/platform/service/macos.rs), written and read as a property list.
[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10"

[build-dependencies]
# The Windows manifest of the binaries (build.rs): long paths. Used for Windows targets only; nothing is embedded elsewhere.
embed-manifest = "1"
# The launcher's version resource (build.rs): its description and version. Windows targets only; needs the Windows
# SDK's resource compiler, which a Rust MSVC toolchain's machine has.
embed-resource = "3"
# Parse the same semantic version the CLI reports for the Windows numeric resource fields.
semver = "1"

# macOS tests: an ACL given to a directory (src/platform/owner_only/macos.rs), the version `sidevoice-platform` reads
# them with.
[target.'cfg(target_os = "macos")'.dev-dependencies]
exacl = "0.13"
