[package]
name = "sidevoice-connector"
version = "0.15.0"
edition = "2021"
publish = false

[[bin]]
name = "sidevoice-connector"
path = "src/main.rs"

# A developer tool (src/bench/main.rs, README "Test bench"): the connector and the pinned core driven from a local page.
# Not part of the release archive, which carries only the connector.
[[bin]]
name = "sidevoice-bench"
path = "src/bench/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
gethostname = "1"
hex = "0.4"
interprocess = { version = "2.4", features = ["tokio"] }
libc = "0.2"
qrcodegen = "1.8"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
ureq = { version = "3", default-features = false, features = ["rustls"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
which = "=8.0.6"
zstd = "0.13"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }

# Unix: the effective uid (src/platform/user), with no `unsafe` of ours.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

# Windows: this process's user and file owners (src/platform/user); the pipe's security descriptor (src/platform/ipc). Minimal features; the version the lock already has.
[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
