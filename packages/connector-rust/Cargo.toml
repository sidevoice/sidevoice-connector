[package]
name = "sidevoice-rust-proof"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.89"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sidevoice-rust-proof"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
rmcp = { version = "3.5", features = ["server", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sidevoice-core-attestation = { package = "sidevoice-sigstore-spike", path = "../../tools/sigstore-spike" }
sigstore-trust-root = { version = "=0.14.0", features = ["tuf"] }
sigstore-tuf = { version = "=0.14.0", features = ["fetch", "rustls"] }
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
