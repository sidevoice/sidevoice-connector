# What only `platform` may call (connector/src/platform): the OS goes through one module per crate.
disallowed-methods = [
    { path = "libc::geteuid", reason = "use platform::user" },
    { path = "libc::getuid", reason = "use platform::user" },
    { path = "libc::gethostname", reason = "use platform::user" },
    { path = "libc::getpwuid", reason = "use platform::user" },
    { path = "std::os::unix::fs::OpenOptionsExt::mode", reason = "use platform::fs (create_private_*, open_private_*)" },
    { path = "std::os::unix::fs::OpenOptionsExt::custom_flags", reason = "use platform::fs (open_no_follow, open_private_*)" },
    { path = "std::os::unix::fs::MetadataExt::mode", reason = "use platform::fs (check_*, is_*)" },
    { path = "std::os::unix::fs::MetadataExt::uid", reason = "use platform::user" },
    { path = "std::os::unix::fs::MetadataExt::nlink", reason = "use platform::fs (has_single_link)" },
]
