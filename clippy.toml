# What only `platform` may call (connector/src/platform): the OS goes through one module per crate.
disallowed-methods = [
    { path = "libc::geteuid", reason = "use platform::user" },
    { path = "libc::getuid", reason = "use platform::user" },
    { path = "libc::gethostname", reason = "use platform::user" },
    { path = "libc::getpwuid", reason = "use platform::user" },
    { path = "std::os::unix::fs::OpenOptionsExt::mode", reason = "use platform::fs (Fs::open_private, create_private_dir)" },
    { path = "std::os::unix::fs::OpenOptionsExt::custom_flags", reason = "use platform::fs (Fs::open_read, open_private)" },
    { path = "std::os::unix::fs::MetadataExt::mode", reason = "use platform::fs (Fs::others, check_private_*)" },
    { path = "std::os::unix::fs::MetadataExt::nlink", reason = "use platform::fs (Fs::link_count)" },
    { path = "libc::kill", reason = "use platform::process" },
    { path = "tokio::process::Command::process_group", reason = "use platform::process" },
    { path = "std::os::unix::process::CommandExt::process_group", reason = "use platform::process" },
    { path = "std::os::unix::process::ExitStatusExt::signal", reason = "use platform::process" },
    { path = "tokio::signal::ctrl_c", reason = "use platform::lifecycle" },
    { path = "tokio::signal::unix::signal", reason = "use platform::lifecycle", allow-invalid = true },
    { path = "tokio::signal::windows::ctrl_c", reason = "use platform::lifecycle", allow-invalid = true },
    { path = "tokio::signal::windows::ctrl_close", reason = "use platform::lifecycle", allow-invalid = true },
    { path = "tokio::signal::windows::ctrl_logoff", reason = "use platform::lifecycle", allow-invalid = true },
    { path = "tokio::signal::windows::ctrl_shutdown", reason = "use platform::lifecycle", allow-invalid = true },
    { path = "secrecy::ExposeSecret::expose_secret", reason = "a secret leaves its wrapper: #[allow] at the one send or store site" },
]

# Local sockets: `platform::ipc` is the only place that opens one (a Unix socket, a named pipe on Windows).
# The third-party sockets of `adapters/` go through `platform::foreign`.
disallowed-types = [
    { path = "tokio::net::UnixListener", reason = "use platform::ipc" },
    { path = "tokio::net::UnixStream", reason = "use platform::ipc" },
    { path = "std::os::unix::net::UnixListener", reason = "use platform::ipc" },
    { path = "std::os::unix::net::UnixStream", reason = "use platform::ipc" },
    { path = "std::os::unix::net::UnixDatagram", reason = "use platform::ipc" },
]

# Logging goes through `tracing` (the shared logging guideline). CLI output meant for people keeps its own call sites,
# each `#[allow]`ed with the reason; tests and build scripts are not logging (crate-level `#![allow]` under `cfg(test)`).
disallowed-macros = [
    { path = "std::dbg", reason = "use tracing" },
    { path = "std::eprintln", reason = "use tracing; CLI output for people #[allow]s it with a reason" },
    { path = "std::println", reason = "use tracing; CLI output for people #[allow]s it with a reason" },
]
